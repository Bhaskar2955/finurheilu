<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>FinUrheilu 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app shell (max 480px), screens in the reference order: splash → select team → personalise → home/matches/calendar/teams/profile, with match detail and notifications as overlays. Single dark look from the FinUrheilu (FanPulse AI) reference. */
:root{
  --bg:#08111F; --card:#0F1A2E; --card-2:#14223B; --line:#1F2E4A; --nav:#0B1526;
  --ink:#EAF2FF; --muted:#94A6C4; --blue:#2F80FF; --cyan:#49C6FF; --lime:#C6FF3D; --red:#FF4D5E; --gold:#FFC83D;
  --lime-t:#C6FF3D; --teal:#2BC4A9; --sel:#132b55; --vsel:#10304a; --rowme:#13305f; --cal:#000; --calcell:#05090f; --calink:#cfd8e8; --calsel:#3a4352;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
:root.light{--teal:#119A82;--bg:#F2F5FA;--card:#FFFFFF;--card-2:#EEF3FA;--line:#D6E0EE;--nav:#FFFFFF;--ink:#0B1730;--muted:#566884;--blue:#1F6FEB;--cyan:#0B7FC0;--lime-t:#3D7A00;--sel:#E3EEFF;--vsel:#E0F2FE;--rowme:#DDEAFF;--cal:#FFFFFF;--calcell:#F4F7FC;--calink:#1d2a40;--calsel:#D6E3F7;color-scheme:light}
:root.light .c,:root.light .trow,:root.light .mcard,:root.light .langbtn,:root.light .icon{box-shadow:0 1px 3px rgba(16,32,64,.08)}
.sb,.splash,.mini,.reel{--ink:#EAF2FF;--muted:#94A6C4;--card:#0F1A2E;--line:#1F2E4A;color:#EAF2FF}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
body.has-dock .app{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.d{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1}
.l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12.5px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2.title{font-family:var(--display);font-size:34px;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:4px 0 0}
.btn{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;height:50px;width:100%;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.lime{background:var(--lime);color:#08111F}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}
.link{background:none;border:0;padding:0;color:var(--cyan);font-weight:600;cursor:pointer;font-size:12.5px}
a{color:var(--cyan)}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;flex:0 0 auto}
.icon svg{width:20px;height:20px}
.icon .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* header + language */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.01em;white-space:nowrap;min-width:0}
.brand svg{flex:0 0 auto}
.hdr .icon,.hdr .langbtn{flex:0 0 auto}
.brand b{color:var(--cyan);font-weight:800}
.brand svg{width:30px;height:30px}
.spacer{margin-inline-end:auto}
.langbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:13px}
.flag{display:inline-block;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.25);line-height:0;flex:0 0 auto}
.flag svg{display:block}
.langwrap{position:relative}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:35;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:transparent;border-radius:10px;cursor:pointer;text-align:start}
.langmenu button{color:var(--ink)}
.langmenu button[aria-pressed="true"]{background:var(--blue);color:#fff}
:root.light .langmenu button:not([aria-pressed="true"]){color:#0B1730}
:root.light .langmenu button:not([aria-pressed="true"]):hover{background:#E3EEFF}
.crest{display:inline-block;flex:0 0 auto;line-height:0}
.crest.lg{display:inline-grid;place-items:center}
.crest.lg img{display:block;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 3px 6px rgba(0,0,0,.45))}
/* splash */
.splash{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;border-radius:24px;padding:18px;background:radial-gradient(120% 70% at 50% 0%,#1d3c78 0%,#0b1a33 55%,#08111F 100%);position:relative;overflow:hidden}
.splash .rink{position:absolute;inset:auto -20% -30% -20%;height:60%;border-radius:50% 50% 0 0;border:2px solid rgba(73,198,255,.25);border-bottom:0}
.splash .rink::before{content:"";position:absolute;left:50%;top:18%;width:120px;height:120px;margin-left:-60px;border-radius:50%;border:2px solid rgba(255,77,94,.35)}
.splash .jersey{font-family:var(--display);font-weight:800;font-size:140px;line-height:.8;color:rgba(255,255,255,.07);position:absolute;right:-6px;bottom:90px}
/* team lists */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;margin-top:12px}
.search input{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;outline:none;min-width:0}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;width:100%;text-align:start}
.trow[aria-pressed="true"]{border-color:var(--blue);background:var(--sel)}
.trow b{display:block}
.grow{flex:1;min-width:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.trow[aria-pressed="true"] .check{background:var(--blue);border-color:var(--blue)}
/* formats */
.pt{padding:14px;display:flex;flex-direction:column;gap:10px}
.fmts{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-size:13px;font-weight:600}
.fbtn svg{width:16px;height:16px}
.fbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.voice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbtn{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:start}
.vbtn[aria-pressed="true"]{border-color:var(--cyan);background:var(--vsel)}
.vbtn small{color:var(--muted)}
/* SPORTIVE SCOREBOARD WIDGET */
.widgets{display:flex;flex-direction:column;gap:12px}
.sb{position:relative;display:block;width:100%;border:0;padding:0;cursor:pointer;border-radius:18px;overflow:hidden;background:#0a1426;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.45);isolation:isolate;color:var(--ink)}
.sb::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,var(--hc) 0 22%,transparent 22.2% 77.8%,var(--ac) 78%);opacity:.55}
.sb::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(112deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px)}
.sb.live{outline:2px solid var(--red);outline-offset:-2px}
.sb-top{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.livechip{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;padding:3px 8px;border-radius:6px}
.prechip{background:rgba(255,255,255,.12);padding:3px 8px;border-radius:6px}
.livechip i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.2}}
.sb-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:8px 10px 6px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sb-team b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.sb-team small{font-size:10.5px;color:#cfe0ff;letter-spacing:.06em;text-transform:uppercase}
.sb-score{display:flex;align-items:center;gap:4px}
.dig{font-family:var(--display);font-weight:800;font-size:50px;line-height:1;min-width:44px;padding:4px 6px;border-radius:10px;background:#050b16;border:1px solid #23324f;color:var(--lime);text-shadow:0 0 14px rgba(198,255,61,.65);font-variant-numeric:tabular-nums}
.dig.time{font-size:30px;color:#fff;text-shadow:none;padding:10px 8px}
.colon{font-family:var(--display);font-size:34px;color:var(--muted)}
.sb-per{display:flex;gap:6px;padding:0 14px 8px;justify-content:center;align-items:center}
.sb-per span{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.pb{width:52px;height:5px;border-radius:3px;background:#1d2b46;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--cyan)}
.sb-tick{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.35);padding:7px 10px;font-size:12px;font-weight:600;min-height:31px}
.sb-tick svg{width:14px;height:14px;color:var(--gold)}
.sb.flash .dig:not(.time){animation:gl .45s ease 4}
@keyframes gl{50%{background:var(--lime);color:#08111F}}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
.dock .inner{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.mini{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:#0a1426;border:1px solid var(--red);box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;width:100%;font-weight:700;font-size:13px}
.mini .s{font-family:var(--display);font-size:22px;color:var(--lime);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.mini .lv{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pl 1s infinite}
/* team sections on home */
.tsec{padding:14px;display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--tc)}
.tsec-h{display:flex;align-items:center;gap:10px}
.tsec-h b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.pos{margin-inline-start:auto;font-size:12px;font-weight:700;background:var(--card-2);border:1px solid var(--line);padding:4px 9px;border-radius:99px;white-space:nowrap}
.hint{font-size:12px;color:var(--muted)}
.item{border-radius:14px;background:var(--card-2);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item h4{margin:0;font-size:15.5px;line-height:1.25}
.tag{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--lime-t)}
/* podcast */
.pod{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.playbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--blue);display:grid;place-items:center;cursor:pointer}
.playbtn svg{width:20px;height:20px}
.wave{display:flex;align-items:center;gap:3px;height:26px;overflow:hidden}
.wave i{display:block;width:3px;flex:0 0 auto;border-radius:2px;background:var(--cyan);opacity:.45}
.playing .wave i{animation:wv .9s ease-in-out infinite;opacity:1}
@keyframes wv{50%{transform:scaleY(1.7)}}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--cyan)}
.vsw{display:inline-flex;gap:4px}
.vsw button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 8px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.vsw button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);font-weight:700}
.transcript{font-size:13px;color:var(--muted);border-inline-start:2px solid var(--line);padding-inline-start:10px;margin-top:8px}
/* reel */
.reel{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,var(--ra) 0%,#0a1426 75%);cursor:pointer;isolation:isolate}
.reel .bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
.reel .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;display:block}
.reel .bars i b{display:block;height:100%;width:0;background:#fff}
.reel .bars i.done b{width:100%}
.reel.playing .bars i.on b{animation:fill 3s linear forwards}
@keyframes fill{to{width:100%}}
.scene{position:absolute;inset:0;padding:28px 14px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;opacity:0;transition:opacity .35s}
.scene.on{opacity:1}
.scene .big{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:32px;line-height:.95;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.scene .cap{font-size:13px;background:rgba(0,0,0,.45);padding:6px 9px;border-radius:8px;align-self:flex-start}
.reel .ice{position:absolute;left:0;right:0;bottom:22%;height:2px;background:rgba(255,255,255,.12);z-index:-1}
.reel .rp{position:absolute;bottom:calc(22% - 5px);left:-20px;width:22px;height:10px;border-radius:50%;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.3);z-index:-1}
.reel.playing .rp{animation:slide 2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes slide{to{left:105%}}
.reel .ov{position:absolute;inset:0;display:grid;place-items:start end;padding:40px 12px;z-index:4;background:rgba(0,0,0,.15)}
.reel.playing .ov{display:none}
.reel .ov span{width:56px;height:56px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.reel .bd{position:absolute;top:18px;inset-inline-end:10px;z-index:3;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:99px}
/* matches */
.mcard{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;text-align:start}
.mcard.mine{border-color:#2a4f8f}
.mcard .tm{display:flex;align-items:center;gap:8px;min-width:0}
.mcard .tm.aw{flex-direction:row-reverse;text-align:end}
.mcard .tm b{font-size:14px;overflow-wrap:anywhere}
.mcard .mid{text-align:center;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding:4px 10px;border-radius:10px;background:var(--card-2)}
.mcard .mid small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mcard .mid.lv{color:var(--lime-t)}
.dayh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.sclink{font-size:11px;color:var(--cyan);font-weight:700;letter-spacing:.06em;text-transform:uppercase;grid-column:1/-1;text-align:center}
/* detail */
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
.ptable th,.ptable td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.ptable th{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.ptable td:first-child,.ptable th:first-child{text-align:start}
.ptable td.tot{font-weight:800;color:var(--lime-t)}
.ev{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev .m{color:var(--cyan);font-family:var(--display);font-size:16px;width:38px}
.stat{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.stat .sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.stat .sbar i{display:block;height:100%}
.sponsor{display:flex;gap:12px;align-items:center;border:1px dashed var(--cyan);border-radius:14px;padding:10px 12px}
.sponsor .slogo{width:44px;height:44px;border-radius:10px;background:var(--cyan);color:#08111F;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:0 0 auto}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-weight:600;font-size:13px}
.pick[aria-pressed="true"]{background:var(--lime);color:#08111F;border-color:var(--lime)}
.mascot{width:70px;height:70px;flex:0 0 auto;background:none;border:0;padding:0;cursor:pointer}
.mascot>svg{width:100%;height:100%;overflow:visible}
.mascot .bg{animation:bob 2.4s ease-in-out infinite;transform-origin:60px 90px}
.mascot.yay .bg{animation:jump .5s ease-out 3}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes jump{40%{transform:translateY(-20px) rotate(-6deg)}}
.bubble{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:600;font-size:14px;min-width:0}
/* accounts, plans, ads */
.form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px;width:100%}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.checkrow input{width:20px;height:20px;margin-top:1px;accent-color:var(--blue);flex:0 0 auto}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
.social{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.social button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.textlink{background:none;border:0;color:var(--cyan);font-weight:700;cursor:pointer;padding:0}
.plan{padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.plan.prem{border:2px solid var(--blue);background:linear-gradient(160deg,rgba(47,128,255,.18),transparent 60%),var(--card)}
.plan .price{font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.plan .price small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600}
.ribbon{position:absolute;top:-11px;inset-inline-end:14px;background:var(--lime);color:#08111F;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.feat li{display:flex;gap:8px;align-items:flex-start}
.feat .ok{color:var(--lime-t);font-weight:800}
.feat .no{color:var(--muted);font-weight:800}
.feat li.off{color:var(--muted)}
.cmpt{width:100%;border-collapse:collapse;font-size:12.5px}
.cmpt th,.cmpt td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
.cmpt th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cmpt td:first-child,.cmpt th:first-child{text-align:start}
.cmpt .y{color:var(--lime-t);font-weight:800}.cmpt .n{color:var(--red);font-weight:800}
.cmpt th.us{color:var(--cyan)}
.fbtn.locked{opacity:.8;border-style:dashed}
.fbtn .lk{width:13px;height:13px}
.lockcard{position:relative;border-radius:16px;overflow:hidden;margin-top:12px}
.lockcard .blur{filter:blur(5px);opacity:.55;pointer-events:none}
.lockcard .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:linear-gradient(180deg,transparent,rgba(8,17,31,.55))}
:root.light .lockcard .ov{background:linear-gradient(180deg,transparent,rgba(242,245,250,.8))}
.lockcard .ov .btn{width:auto;padding:0 22px}
.teaser{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px dashed var(--blue);background:transparent;color:var(--ink);cursor:pointer;width:100%;font-weight:600;text-align:start}
.teaser svg{width:18px;height:18px;color:var(--blue);flex:0 0 auto}
.ad{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;text-decoration:none;color:#fff;overflow:hidden;min-height:92px;background:var(--adbg)}
.ad .adl{position:absolute;top:8px;inset-inline-end:10px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:99px;color:#fff}
.ad .brandw{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;flex:0 0 auto;min-width:88px;color:var(--adfg,#fff)}
.ad .adt{display:flex;flex-direction:column;gap:3px;min-width:0}
.ad .adt b{font-size:15.5px}
.ad .adt span{font-size:12.5px;opacity:.9}
.ad .cta{margin-inline-start:auto;flex:0 0 auto;font-size:12px;font-weight:800;background:#fff;color:#111;padding:7px 10px;border-radius:10px;align-self:flex-end}
.pbadge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--card-2);border:1px solid var(--line)}
.pbadge.prem{background:var(--lime);color:#08111F;border-color:var(--lime)}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,200,61,.14);border:1px solid var(--gold);font-size:13.5px}
.upsell{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:start;cursor:pointer}
.c>.upsell:last-child{border-bottom:0}
.upsell .ui{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:0 0 auto;font-weight:800}
.hist{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.c>.hist:last-child{border-bottom:0}
/* live analytics */
.dsticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;margin:0 -4px 10px;border-radius:14px;background:linear-gradient(90deg,rgba(47,128,255,.25),rgba(255,77,94,.25)),var(--card);border:1px solid var(--line);backdrop-filter:blur(8px);font-weight:800}
.dsticky .ds{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.dsticky .ab{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.an{padding:14px;display:flex;flex-direction:column;gap:8px}
.an h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.an svg{display:block;width:100%;height:auto;overflow:visible}
.an .vs{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.gk{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center}
.gk b{font-family:var(--display);font-size:24px}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-align:center;color:var(--muted)}
.cmp .v{font-family:var(--display);font-weight:800;font-size:22px}
.cmp .bar2{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:8px;gap:2px}
.cmp .bar2 i{display:block;height:100%}
.icon.sm{width:32px;height:32px;border-radius:10px}
.icon.sm svg{width:16px;height:16px}
.box{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.box th{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.box td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.box td.pl,.box th.pl{text-align:start}
.box tr[data-player]{cursor:pointer}
.box tr[data-player]:hover td{background:var(--card-2)}
.box .pn{display:flex;align-items:center;gap:8px}
.box td.hi{font-weight:800;color:var(--lime-t)}
.goalie{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:none;border:0;cursor:pointer;padding:0;min-width:0}
.goalie b{font-size:14px;font-family:var(--body)}
.best{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;text-align:center;min-width:0}
.bp .rk{font-family:var(--display);font-size:14px;color:var(--gold);font-weight:800}
.bp b{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.phero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;text-align:center}
.phero h2{font-family:var(--display);font-size:36px;margin:6px 0 0;line-height:1;letter-spacing:.01em}
.rings{display:flex;justify-content:space-between;gap:2px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0;font-size:10.5px;color:var(--muted);text-align:center;font-weight:600;line-height:1.2}
.mbar{display:flex;flex-direction:column;gap:4px}
.mbar .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.mbar .t b{font-family:var(--display);font-size:22px;letter-spacing:0}
.mbar .tr{height:8px;border-radius:4px;background:var(--card-2);overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:4px;transition:width .5s}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;background:var(--cal);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:8px}
.calhead b{font-family:var(--display);font-size:24px;color:var(--calink);text-transform:capitalize;letter-spacing:.02em}
.calhead button{background:none;border:0;cursor:pointer;padding:4px 12px;font-size:28px;line-height:1;color:var(--calink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--cal);border:1px solid var(--line);border-top:0;padding:0 2px 2px;border-radius:0 0 14px 14px}
.cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--calink);padding:8px 0}
.cday{position:relative;aspect-ratio:1/1.4;background:var(--calcell);border:0;color:var(--calink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:5px 1px;min-width:0;overflow:hidden}
.cday .n{font-size:15px}
.cday.out .n{opacity:.35}
.cday.sel{background:var(--calsel)}
.cday.today .n{color:var(--cyan);font-weight:800}
.cday.home::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 13px 13px 0;border-color:transparent var(--red) transparent transparent}
.cday .rs{font-size:9px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.rs.w{color:var(--lime-t)} .rs.l{color:var(--red)}
.calinfo{padding:14px;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.calinfo .big{font-size:26px;font-weight:600;line-height:1.1}
.calinfo .mt{color:var(--red);font-weight:800;font-size:17px}
/* standings */
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.st th{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}
table.st td{padding:7px 6px;border-bottom:1px solid var(--line)}
table.st td.n,table.st th.n{text-align:end}
table.st tr.me td{background:var(--rowme)}
table.st tr.cut td{border-bottom:2px dashed var(--cyan)}
.tcell{display:flex;align-items:center;gap:8px}
/* profile */
.pcard{display:flex;align-items:center;gap:12px;padding:14px}
.av{width:48px;height:48px;border-radius:50%;background:#6c5ce7;display:grid;place-items:center;font-weight:800;font-size:20px}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start}
.c>.set:last-child{border-bottom:0}
button.set{cursor:pointer}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:0 0 auto}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.tgl[aria-pressed="true"]{background:var(--blue)}
.tgl[aria-pressed="true"]::after{inset-inline-start:21px}
.fol{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.c>.fol:last-child{border-bottom:0}
.smallbtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.smallbtn.add{background:var(--blue);border-color:var(--blue);color:#fff}
/* notifications */
.nt{display:flex;gap:12px;align-items:flex-start;padding:12px}
.nt .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.nt .ic svg{width:18px;height:18px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .inner{max-width:480px;margin:0 auto;height:66px;display:flex;justify-content:space-around;align-items:center;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;padding:6px 4px;min-width:0}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--cyan);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--lime);color:#08111F;font-weight:700;padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.srcline{line-height:1.6}
.widgets{gap:8px}
.sbm{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;border:0;cursor:pointer;border-radius:14px;padding:8px 10px 27px;background:#0a1426;color:#EAF2FF;overflow:hidden;isolation:isolate;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .15s}
.sbm::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--hc) 0 17%,transparent 17.2% 82.8%,var(--ac) 83%);opacity:.6}
.sbm::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px)}
.sbm:active{transform:scale(.98)}
.sbm.live{outline:2px solid var(--red);outline-offset:-2px}
.sbm-t{display:flex;align-items:center;gap:6px;min-width:0}
.sbm-t.aw{justify-content:flex-end}
.sbm-t b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.sbm-s{font-family:var(--display);font-weight:800;font-size:26px;color:var(--lime);text-shadow:0 0 10px rgba(198,255,61,.55);background:#050b16;border:1px solid #23324f;border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.sbm-s i{font-style:normal;color:#94A6C4;padding:0 2px}
.sbm-st{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#cfe0ff}
.sbm-st .livechip{padding:1px 6px;font-size:9.5px}
.sbm.flash .sbm-s{animation:gl .45s ease 4}
.sb.grow-in{animation:growIn .3s ease-out;transform-origin:top center}
@keyframes growIn{from{transform:scaleY(.55);opacity:.3}to{transform:none;opacity:1}}
.dock .inner{align-items:flex-end}
.dmini{pointer-events:auto;position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:#0a1426;color:#EAF2FF;box-shadow:0 8px 20px rgba(0,0,0,.45);cursor:pointer;overflow:hidden;isolation:isolate;font:inherit}
.dmini::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--hc) 0 22%,transparent 22.5% 77.5%,var(--ac) 78%);opacity:.55}
.dmini.live{border-color:var(--red)}
.dmini .lv{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pl 1s infinite}
.dmini .dsc{font-family:var(--display);font-weight:800;font-size:18px;color:var(--lime);text-shadow:0 0 8px rgba(198,255,61,.5);font-variant-numeric:tabular-nums;background:#050b16;border-radius:6px;padding:0 6px;line-height:1.35}
.dmini .dsc i{font-style:normal;color:#94A6C4;padding:0 1px}
.dmini .dclk{font-size:10px;font-weight:700;letter-spacing:.06em;color:#cfe0ff;white-space:nowrap}
/* ===== community ===== */
nav.bottom button{position:relative}
nav.bottom button span{font-size:10px}
.nlock{position:absolute;top:1px;right:calc(50% - 17px);width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.nlock svg{width:9px!important;height:9px!important}
.cmlock{display:grid;gap:12px;justify-items:start;padding:20px}
.cmlock-i{width:52px;height:52px;border-radius:14px;background:var(--sel);color:var(--blue);display:grid;place-items:center}
.cmlock-i svg{width:28px;height:28px}
.cmlock .feat{margin:0}
.ndot{position:absolute;top:3px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.cmrooms{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.rchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.rchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.rchip .ud{width:8px;height:8px;border-radius:50%;background:var(--red)}
.cmroom{padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;margin-top:10px}
.onl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--lime-t);white-space:nowrap}
.onl i{width:8px;height:8px;border-radius:50%;background:var(--lime-t)}
.cmmsgs{height:min(52vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px;overscroll-behavior:contain}
.cmempty{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:30ch}
.msg{display:flex;gap:8px;align-items:flex-start}
.mav{width:32px;height:32px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:var(--card-2)}
.mb{min-width:0;flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 10px}
.msg.me .mb{background:var(--sel);border-color:var(--blue)}
.mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.mt{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:2px}
.mtr{font-size:13.5px;color:var(--muted);margin-top:4px;border-inline-start:2px solid var(--cyan);padding-inline-start:8px}
.mr{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.rx{border:1px solid var(--line);background:transparent;border-radius:99px;padding:1px 7px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.rx[aria-pressed="true"]{border-color:var(--cyan);background:var(--vsel)}
.ma{margin-inline-start:auto;display:flex;gap:10px}
.ma button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;font-weight:600}
.ltag{font-size:10px;font-weight:800;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.cheers{display:flex;gap:6px}
.cheers button{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:12px;font-size:20px;padding:5px 0;cursor:pointer}
.cmform{display:flex;gap:8px}
.cmform input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);padding:0 12px;font:inherit}
.cmform .btn{width:auto;padding:0 18px;height:46px}
.cmfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cmfx span{position:absolute;bottom:70px;font-size:30px;animation:rise 1.8s ease-out forwards}
@keyframes rise{to{transform:translateY(-300px) scale(1.4);opacity:0}}
.catch{font-size:13.5px;background:var(--vsel);border-radius:12px;padding:10px 12px;white-space:pre-wrap}
.fan{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.c>.fan:last-child{border-bottom:0}
.fan.me{background:var(--rowme)}
.fan .rk{font-family:var(--display);font-size:20px;width:26px;text-align:center;color:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);text-align:center;font-size:11.5px;font-weight:700}
.badge span{font-size:24px}
.badge.off{opacity:.35;filter:grayscale(1)}
.qopt{display:block;width:100%;text-align:start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);cursor:pointer;font-weight:600;margin-top:8px;color:var(--ink);font:inherit}
.qopt.ok{border-color:var(--lime-t);background:color-mix(in srgb,var(--lime-t) 18%,var(--card-2))}

function crest(name,size=34){const t=T[name];if(!t)return"";const z=Math.round(size*1.35);return `<span class="crest lg" title="${esc(name)}" style="width:${z}px;height:${z}px"><img src="${LOGO[name]}" alt="${esc(name)}" width="${z}" height="${z}"></span>`}

/* ======================= THEME (dark / light / system) ======================= */
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
function isLight(){const m=P.mode||"system";if(m!=="system")return m==="light";const dt=document.documentElement.getAttribute("data-theme");if(dt)return dt==="light";return !!(mq&&mq.matches)}
function applyMode(){document.documentElement.classList.toggle("light",isLight())}
if(mq&&mq.addEventListener)mq.addEventListener("change",()=>{applyMode();render()});
try{new MutationObserver(()=>{if((P.mode||"system")==="system"){applyMode();render()}}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}

/* ======================= HEADER (language switch top-right) ======================= */
function header(left){const x=s();
 return `<div class="hdr">${left||`<div class="brand">${IC.logo}<span>Fin<b>Urheilu</b></span></div>`}<span class="spacer"></span>
  <button class="icon" data-modeflip aria-label="${esc(isLight()?x.dark:x.light)}">${isLight()?IC.moon:IC.sun}</button>
  ${P.screen==="app"?`<button class="icon" data-notif aria-label="${esc(x.notifs)}">${IC.bell}${live.goals?'<span class="dot"></span>':""}</button>`:""}
  <div class="langwrap"><button class="langbtn" data-langmenu aria-expanded="${langOpen}" aria-label="${esc(x.lang)}">${flag(P.lang)}${P.lang.toUpperCase()}</button>
  ${langOpen?`<div class="langmenu">${LANGS.map(([k,n])=>`<button data-lang="${k}" aria-pressed="${P.lang===k}">${flag(k,28,18)}<span>${n}</span></button>`).join("")}</div>`:""}</div></div>`}

/* ======================= LIVE ENGINE (simulated) ======================= */
function slot(){const mine=GAMES.filter(g=>g.d>=TODAY&&isMine(g)).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
 if(!mine.length)return null;const {d,t}=mine[0];return {d,t,games:mine.filter(g=>g.d===d&&g.t===t)}}
const live={on:false,min:0,timer:null,st:{},goals:0,feed:[]};
const gs=id=>live.st[id]||(live.st[id]={hs:0,as:0,sh:0,sa:0,xh:0,xa:0,tl:[],per:[[0,0],[0,0],[0,0]],ev:[],flash:0});
const started=()=>live.on||live.min>0;
const inSlot=id=>live.slot&&live.slot.games.some(g=>g.id===id);
function clockTxt(){const x=s();if(live.min>=60)return x.final;const p=Math.floor(live.min/20)+1;return `${x.per}${p} · ${String(20-live.min%20).padStart(2,"0")}:00`}
function startLive(){if(live.on)return;const sl=slot();if(!sl)return;if(live.min>=60){live.min=0;live.st={};live.feed=[]}
 live.slot=sl;live.on=true;live.timer=setInterval(tick,650);render()}
function tick(){live.min++;const x=s();
 live.slot.games.forEach(g=>{const st=gs(g.id);const p=Math.min(2,Math.floor((live.min-1)/20));
  const bias=(posOf(g.a)-posOf(g.h))/60;let nh=(Math.random()<.42+bias?1:0)+(Math.random()<.12?1:0),na=(Math.random()<.42-bias?1:0)+(Math.random()<.12?1:0);
  for(let k=0;k<nh;k++)st.xh+=.04+Math.random()*.12;for(let k=0;k<na;k++)st.xa+=.04+Math.random()*.12;st.sh+=nh;st.sa+=na;playMinute(g,st);addShots(g,st,nh,na);const mm={h:nh,a:na,g:null};st.tl.push(mm);
  const r=Math.random();if(r<.05||r>.955){const home=r<.05;if(home){st.hs++;st.per[p][0]++;st.sh++;mm.h++;st.xh+=.22}else{st.as++;st.per[p][1]++;st.sa++;mm.a++;st.xa+=.22}mm.g=home?"h":"a";st.flash=Date.now();
   const team=home?g.h:g.a;const who=goalBy(g,st,home);st.ev.push({m:live.min,team,score:`${st.hs}–${st.as}`,who});
   if(P.teams.includes(team)){live.goals++;live.feed.unshift({k:"match",t:x.nGoal(team,`${g.h} ${st.hs}–${st.as} ${g.a}`),team,time:1})}
   if(contest.game===g.id)resolvePick(home?"home":"away")}});
 if(live.min>=60){clearInterval(live.timer);live.on=false;if(contest.pick==="none"){addPts();toast(x.correct)}contest.pick=null;render();return}
 patchLive()}
function scoreboard(g){const x=s();const st=gs(g.id);const on=started()&&inSlot(g.id);const last=st.ev[st.ev.length-1];const fl=Date.now()-st.flash<1800;

 const dateTxt=g.d===TODAY?x.today:dayName(g.d,{weekday:"short",day:"numeric",month:"numeric"});
 return `<button class="sb ${on&&live.on?"live":""} ${fl?"flash":""}" data-sb="${g.id}" data-open="${g.id}" style="--hc:${T[g.h].col};--ac:${T[g.a].col}" aria-label="${esc(g.h)} – ${esc(g.a)}">

function patchLive(){const x=s();
 document.querySelectorAll("[data-dk]").forEach(el=>{const g=GAMES.find(z=>z.id===el.dataset.dk);if(g&&inSlot(g.id))el.outerHTML=dockItem(g)});
 document.querySelectorAll("[data-sb]").forEach(el=>{const g=GAMES.find(z=>z.id===el.dataset.sb);if(!g||!inSlot(g.id))return;const st=gs(g.id);

 const nb=document.querySelector("[data-notif]");if(nb&&live.goals&&!nb.querySelector(".dot"))nb.insertAdjacentHTML("beforeend",'<span class="dot"></span>');

/* ======================= VOICES (female / male, soft tone) ======================= */
const FEM=/female|woman|samantha|karen|moira|tessa|fiona|serena|kate|susan|zira|hazel|libby|sonia|heidi|satu|noora|alva|klara|sofie|emma|amy|jenny|aria|anna|sara|maria|ida|nora|victoria/i;
const MAL=/\bmale\b|daniel|oliver|alex|fred|george|ryan|guy|david|mark|onni|harri|oskar|mattias|erik|arthur|thomas|james|william|lee/i;
function pickVoice(lang,gender){let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
 const m=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(!m.length)return {voice:null,exact:false,none:vs.length>0};
 const want=gender==="female"?m.find(v=>FEM.test(v.name)&&!/\bmale\b/i.test(v.name)):m.find(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 return {voice:want||m[0],exact:!!want,none:false}}
function speak(texts,onend){const lang=SPK[P.lang];
 try{speechSynthesis.cancel();const {voice,exact,none}=pickVoice(lang,P.voice);if(none)return false;
  texts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;if(voice)u.voice=voice;
   u.rate=.9;u.volume=.85;u.pitch=P.voice==="female"?(exact?1.05:1.25):(exact?.9:.7);if(i===texts.length-1&&onend)u.onend=onend;speechSynthesis.speak(u)});return true}catch(e){return false}}

 const ng=GAMES.find(g=>g.d>=TODAY&&(g.h===tm||g.a===tm));
 if(ng){const home=ng.h===tm;out.push({id:"n"+tm,t:x.nextT(tm,ng.h,ng.a),b:x.nextB(dayName(ng.d),ng.t,T[ng.h].city,home,tm,pos,row[2]),v:[x.upNext,`${T[ng.h].ab} – ${T[ng.a].ab}`,`${dayName(ng.d)} · ${ng.t}`],g:ng,src:2})}
 const lr=[...RESULTS].reverse().find(r=>r.h===tm||r.a===tm);
 if(lr){const won=(lr.h===tm)?lr.hs>lr.as:lr.as>lr.hs;const p=ptsFor(lr,tm);out.push({id:"r"+tm,t:x.lastT(lr),b:x.lastB(tm,won,lr.x,p),v:[x.recent,`${lr.hs}–${lr.as}`,`${lr.h} – ${lr.a}${lr.x?" ("+lr.x+")":""}`],g:lr,src:tm==="Kärpät"?1:0})}

/* podcast */
const pod={id:null,on:false,t0:0,dur:0,timer:null};
const est=st=>Math.max(12,(st.t+" "+st.b).split(/\s+/).length*.5+3);
let STO={};
function podcast(st){const x=s();STO[st.id]=st;const on=pod.id===st.id&&pod.on;
 return `<div class="${on?"playing":""}" data-pod="${st.id}"><div class="pod"><button class="playbtn" data-podplay="${st.id}" aria-label="${esc(on?x.pause:x.play)}">${on?IC.pause:IC.play}</button>
  <div class="stack" style="gap:6px;min-width:0"><div class="between" style="flex-wrap:wrap"><span class="small muted">~${Math.round(est(st))} s · ${esc(x.soft)}</span>
   <span class="vsw" role="group" aria-label="${esc(x.voice)}"><button data-voice="female" aria-pressed="${P.voice==="female"}">${esc(x.female)}</button><button data-voice="male" aria-pressed="${P.voice==="male"}">${esc(x.male)}</button></span></div>
   <div class="wave">${Array.from({length:30},(_,i)=>`<i style="height:${6+((i*37)%16)}px;animation-delay:${(i%8)*.1}s"></i>`).join("")}</div>
   <div class="bar"><span data-pbar="${st.id}"></span></div></div></div><div class="transcript" data-tr="${st.id}" hidden></div></div>`}
function stopPod(){clearInterval(pod.timer);try{speechSynthesis.cancel()}catch(e){}const old=pod.id;pod.on=false;pod.id=null;if(old)refreshPod(old)}
function refreshPod(id){const el=document.querySelector(`[data-pod="${id}"]`);if(!el)return;const on=pod.id===id&&pod.on;el.classList.toggle("playing",on);
 el.querySelector("[data-podplay]").innerHTML=on?IC.pause:IC.play;if(!on)el.querySelector("[data-pbar]").style.width="0"}
function playPod(id){const st=STO[id];if(!st)return;if(pod.id===id&&pod.on){stopPod();return}stopPod();stopReels();
 pod.id=id;pod.on=true;pod.t0=Date.now();pod.dur=est(st)*1000;refreshPod(id);
 const ok=speak([st.t,st.b],()=>{if(pod.id===id)stopPod()});
 const tr=document.querySelector(`[data-tr="${id}"]`);if(tr){tr.hidden=false;tr.innerHTML=(ok?"":`<b>${esc(s().noVoice)}</b><br>`)+esc(st.t)+". "+esc(st.b)}

const reels={};
const FSL={fi:"Koko näyttö",en:"Full screen",sv:"Helskärm"},FSX={fi:"Poistu koko näytöstä",en:"Exit full screen",sv:"Avsluta helskärm"};
function fsBtn(){return `<button type="button" class="fsb" data-fs title="${esc(FSL[P.lang]||FSL.en)}" aria-label="${esc(FSL[P.lang]||FSL.en)}"><svg class="o" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>`}
function fsCur(){return document.fullscreenElement||document.webkitFullscreenElement||document.querySelector(".reel.fsx")}
function fsLabel(el,on){const b=el&&el.querySelector(".fsb");if(b){const t=(on?FSX:FSL)[P.lang]||(on?FSX:FSL).en;b.title=t;b.setAttribute("aria-label",t)}}
function exitFs(){const cur=fsCur();if(!cur)return;if(cur.classList.contains("fsx")){cur.classList.remove("fsx");document.documentElement.style.overflow="";fsLabel(cur,false)}else{const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex)try{const r=ex.call(document);if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
function toggleFs(el){if(!el)return;if(fsCur()){exitFs();return}
 // Real full screen where the browser allows it; otherwise (iPhone, embedded pages) fill the window.
 const fake=()=>{el.classList.add("fsx");document.documentElement.style.overflow="hidden";fsLabel(el,true)};
 const rq=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!rq)fake();else try{const r=rq.call(el);if(r&&r.catch)r.catch(fake)}catch(e){fake()}
 const id=el.dataset.reel;if(!(reels[id]&&reels[id].on))toggleReel(id)}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{const cur=document.fullscreenElement||document.webkitFullscreenElement;document.querySelectorAll(".reel").forEach(r=>fsLabel(r,r===cur))}));
function reel(st,tm){const x=s();const g=st.g;const c=T[tm]?T[tm].col:"#2F80FF";
 const sc=[`<div class="big">${esc(st.v[0])}</div>${g?`<div class="row">${crest(g.h,40)}<span class="d" style="font-size:22px">vs</span>${crest(g.a,40)}</div>`:crest(tm,44)}`,

  `<div class="cap" style="font-size:14px">${esc(st.b)}</div>`];
 return `<div class="reel" data-reel="${st.id}" data-n="3" style="--ra:${c}" role="button" aria-label="${esc(x.play)}"><div class="bars">${sc.map((_,i)=>`<i class="${i?"":"on"}"><b></b></i>`).join("")}</div>
  <span class="bd">${esc(x.reel)}</span><div class="ice"></div><div class="rp"></div>${sc.map((z,i)=>`<div class="scene ${i?"":"on"}">${z}</div>`).join("")}
  ${fsBtn()}<div class="ov"><span>${IC.play.replace("<svg",'<svg width="24" height="24"')}</span></div></div>`}
function stopReels(ex){Object.keys(reels).forEach(id=>{if(id!==ex)pauseReel(id)})}
function pauseReel(id){const r=reels[id];if(!r)return;clearTimeout(r.t);r.on=false;const el=document.querySelector(`[data-reel="${id}"]`);if(el)el.classList.remove("playing")}
function showScene(id,i){const el=document.querySelector(`[data-reel="${id}"]`);if(!el)return;el.querySelectorAll(".scene").forEach((z,k)=>z.classList.toggle("on",k===i));
 el.querySelectorAll(".bars i").forEach((b,k)=>{b.classList.toggle("done",k<i);b.classList.remove("on");if(k===i){void b.offsetWidth;b.classList.add("on")}})}
function toggleReel(id){const r=reels[id]||(reels[id]={i:0,on:false});if(r.on){pauseReel(id);return}stopReels(id);stopPod();
 const el=document.querySelector(`[data-reel="${id}"]`);const n=+el.dataset.n;if(r.i>=n)r.i=0;r.on=true;el.classList.add("playing");showScene(id,r.i);

/* ======================= LIVE ANALYTICS (model on simulated data) ======================= */
function winProb(g){const st=gs(g.id);const t=Math.min(live.min,60);const diff=st.hs-st.as;
 const z=.15+.5*(posOf(g.a)-posOf(g.h))/16+diff*(.9+1.8*t/60)+.035*(st.sh-st.sa)*(1-t/60);
 if(t>=60&&diff===0)return 50;if(t>=60)return diff>0?99:1;return Math.round(Math.max(2,Math.min(98,100/(1+Math.exp(-z)))))}
function gauge(p){const cx=150,cy=150,r=110;const pt=(v,rr)=>{const a=Math.PI*(1-v/100);return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
 const arc=(v0,v1,col,w)=>{const [x0,y0]=pt(v0,r),[x1,y1]=pt(v1,r);return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`};
 let ticks="";for(let v=0;v<=100;v+=10){const [x,y]=pt(v,r-28);ticks+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">${v}</text>`}
 for(let v=0;v<=100;v+=2.5){const [x0,y0]=pt(v,r+10),[x1,y1]=pt(v,r+(v%10===0?18:14));ticks+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--line)" stroke-width="1.5"/>`}
 const [nx,ny]=pt(p,r-8);
 return `<svg viewBox="0 0 300 175" role="img" aria-label="${p}%">${arc(0,100,"var(--line)",16)}${arc(0,p,"var(--blue)",16)}${arc(p,100,"var(--red)",16)}${ticks}
  <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" style="transition:all .6s"/><circle cx="${cx}" cy="${cy}" r="8" fill="var(--ink)"/><circle cx="${cx}" cy="${cy}" r="3" fill="var(--card)"/></svg>`}
function flowChart(g){const st=gs(g.id);const W=300,H=150,mid=75,bw=W/60;const mx=3;
 let bars="";st.tl.forEach((m,i)=>{const x=i*bw+.5;const hh=m.h/mx*60,ha=m.a/mx*60;
  if(m.h)bars+=`<rect x="${x.toFixed(1)}" y="${(mid-hh).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${hh.toFixed(1)}" rx="1" fill="var(--blue)"/>`;
  if(m.a)bars+=`<rect x="${x.toFixed(1)}" y="${mid}" width="${(bw-1).toFixed(1)}" height="${ha.toFixed(1)}" rx="1" fill="var(--red)"/>`;
  if(m.g)bars+=`<circle cx="${(x+bw/2).toFixed(1)}" cy="${m.g==="h"?(mid-hh-7).toFixed(1):(mid+ha+7).toFixed(1)}" r="4" fill="var(--gold)" stroke="var(--card)" stroke-width="1.5"/>`});
 const lines=[20,40].map(v=>`<line x1="${v*bw}" y1="6" x2="${v*bw}" y2="${H-6}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join("");
 const lbl=[0,20,40,60].map(v=>`<text x="${Math.min(W-10,Math.max(8,v*bw))}" y="${H+12}" text-anchor="middle" font-size="10" fill="var(--muted)">${v}'</text>`).join("");
 const now=`<line x1="${Math.min(60,live.min)*bw}" y1="2" x2="${Math.min(60,live.min)*bw}" y2="${H-2}" stroke="var(--cyan)" stroke-width="2"/>`;
 return `<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="flow"><line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--muted)" stroke-width="1"/>${lines}${bars}${now}${lbl}</svg>`}
function miniGauge(v,col){const cx=70,cy=70,r=52;const c=Math.max(-5,Math.min(5,v));const pt=(x,rr)=>{const a=Math.PI*(1-(x+5)/10);return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
 const [x0,y0]=pt(0,r),[x1,y1]=pt(c,r),[nx,ny]=pt(c,r-10);const sweep=c>=0?1:0;
 return `<svg viewBox="0 0 140 92"><path d="M18 70A52 52 0 0 1 122 70" fill="none" stroke="var(--line)" stroke-width="12"/>${Math.abs(c)>.01?`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A52 52 0 0 ${sweep} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="12"/>`:""}
  <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="${col}"/>
  <text x="10" y="88" font-size="10" fill="var(--muted)">−5</text><text x="130" y="88" font-size="10" fill="var(--muted)" text-anchor="end">+5</text><text x="70" y="12" font-size="10" fill="var(--muted)" text-anchor="middle">0</text></svg>`}
function cmpRow(label,a,b,fa=v=>v,fb=v=>v){const t=(+a)+(+b)||1;return `<span class="v" style="color:var(--blue)">${fa(a)}</span><span class="lbl">${label}</span><span class="v" style="color:var(--red);text-align:end">${fb(b)}</span>

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const ROSTER={};
function roster(tm){if(ROSTER[tm])return ROSTER[tm];const r=rng(TEAMS.findIndex(t=>t.name===tm)*977+13);const used=new Set(),nums=new Set();
 const pick=()=>{let n;do{n=FNAMES[Math.floor(r()*FNAMES.length)]+" "+LNAMES[Math.floor(r()*LNAMES.length)]}while(used.has(n));used.add(n);return n};
 const num=(lo,hi)=>{let k;do{k=lo+Math.floor(r()*(hi-lo))}while(nums.has(k));nums.add(k);return k};
 const L=[{pos:"G",no:num(30,40)},{pos:"G",no:num(30,40)}];for(let i=0;i<9;i++)L.push({pos:"F",no:num(10,99)});for(let i=0;i<6;i++)L.push({pos:"D",no:num(2,80)});
 L.forEach(p=>{p.n=pick();p.team=tm;p.id=tm+"#"+p.no;p.base={att:35+r()*50,def:35+r()*50,sho:30+r()*55,pas:30+r()*55,ska:40+r()*45}});
 return ROSTER[tm]=L}
const skaters=tm=>roster(tm).filter(p=>p.pos!=="G");
const findPlayer=id=>{const i=id.lastIndexOf("#");return roster(id.slice(0,i)).find(p=>String(p.no)===id.slice(i+1))};
const fmtT=v=>{v=Math.round(v);return Math.floor(v/60)+":"+String(v%60).padStart(2,"0")};
const clp=v=>Math.max(1,Math.min(99,Math.round(v)));
function pst(st,p){st.ps=st.ps||{};return st.ps[p.id]||(st.ps[p.id]={g:0,a:0,s:0,pm:0,toi:0,xg:0})}
function wpick(list){const w=list.map(p=>p.pos==="F"?3:1);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[0]}
function playMinute(g,st){[g.h,g.a].forEach(tm=>skaters(tm).forEach(p=>{pst(st,p).toi+=p.pos==="D"?19+Math.random()*9:12+Math.random()*10}))}
function addShots(g,st,nh,na){[[g.h,nh],[g.a,na]].forEach(([tm,n])=>{for(let k=0;k<n;k++){const q=pst(st,wpick(skaters(tm)));q.s++;q.xg+=.04+Math.random()*.12}})}
function goalBy(g,st,home){const tm=home?g.h:g.a,op=home?g.a:g.h;const sk=skaters(tm);const sc=wpick(sk);const q=pst(st,sc);q.g++;q.s++;q.xg+=.22;
 const rest=sk.filter(p=>p!==sc).sort(()=>Math.random()-.5);const na=Math.random()<.15?0:Math.random()<.4?1:2;const as=rest.slice(0,na);as.forEach(p=>pst(st,p).a++);
 [sc,...rest.slice(0,4)].forEach(p=>pst(st,p).pm++);[...skaters(op)].sort(()=>Math.random()-.5).slice(0,5).forEach(p=>pst(st,p).pm--);
 return {id:sc.id,no:sc.no,n:sc.n}}

/* ======================= v2 CONTEXT ENGINE + TRUST LAYER ======================= */
/* Every number and name in a story is a "claim" that points to the data it came from.
   verify() re-checks each claim with its own code path; checkText() blocks any number or team name
   in the final text that no claim backs up. Demo: rule-based writer; production: an LLM writes with
   the same claims and the same checker. */
const MON_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fDate(d,L){const [y,m,dd]=d.split("-").map(Number);return L==="en"?`${dd} ${MON_EN[m-1]}`:`${dd}.${m}.`}
function fOrd(n,L){if(L!=="en")return String(n);const t=(n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");return n+t}
function fNum(n,L){const t=n.toFixed(2);return L==="en"?t:t.replace(".",",")}
const C=(v,k,ref)=>({cl:1,v:String(v),k,ref});
function K(str,...vals){const out=[];str.forEach((p,i)=>{if(p)out.push(p);if(i<vals.length){const v=vals[i];if(v==null||v==="")return;if(Array.isArray(v))out.push(...v);else out.push(v)}});return out}
const plain=toks=>(toks||[]).map(t=>t&&t.cl?t.v:t).join("");
const teamRes=tm=>RESULTS.filter(r=>r.h===tm||r.a===tm).slice().sort((a,b)=>a.d.localeCompare(b.d));
const wonBy=(r,tm)=>r.h===tm?r.hs>r.as:r.as>r.hs;
const nextGame=tm=>GAMES.filter(g=>g.d>=TODAY&&(g.h===tm||g.a===tm)).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))[0];

/* demo lower-division league (fictional teams, clearly labelled) */
const DEMO_T=["Polar Foxes U16","Bay Eagles U16","River Wolves U16","North Stars U16"];
const DEMO_R=[{id:"j1",d:"2026-10-04",h:DEMO_T[0],a:DEMO_T[1],hs:4,as:2,x:""},{id:"j2",d:"2026-10-05",h:DEMO_T[2],a:DEMO_T[3],hs:1,as:3,x:""},
 {id:"j3",d:"2026-10-11",h:DEMO_T[3],a:DEMO_T[0],hs:2,as:5,x:""},{id:"j4",d:"2026-10-12",h:DEMO_T[1],a:DEMO_T[2],hs:3,as:3,x:""},
 {id:"j5",d:"2026-10-18",h:DEMO_T[0],a:DEMO_T[2],hs:6,as:1,x:""},{id:"j6",d:"2026-10-19",h:DEMO_T[1],a:DEMO_T[3],hs:2,as:4,x:""}];
function demoStand(){const m={};DEMO_T.forEach(t=>m[t]=0);DEMO_R.forEach(r=>{if(r.hs>r.as)m[r.h]+=3;else if(r.as>r.hs)m[r.a]+=3;else{m[r.h]+=1;m[r.a]+=1}});return DEMO_T.map(t=>[t,m[t]]).sort((a,b)=>b[1]-a[1])}

/* ---------- context for one team (one game) ---------- */
function ctx(tm,L,rid){const all=teamRes(tm);if(!all.length)return null;
 const idx=rid?all.findIndex(r=>r.id===rid):all.length-1;if(idx<0)return null;
 const r=all[idx],latest=idx===all.length-1,home=r.h===tm,my=home?r.hs:r.as,op=home?r.as:r.hs,opp=home?r.a:r.h,won=my>op,gpn=won?(r.x?2:3):(r.x?1:0);
 const c={r,latest,won,x:r.x,gpn,tmName:tm,oppName:opp,
  tm:C(tm,"team",{rid:r.id}),opp:C(opp,"team",{rid:r.id}),score:C(`${my}–${op}`,"score",{rid:r.id,team:tm}),gp:C(gpn,"gpts",{rid:r.id,team:tm}),date:C(fDate(r.d,L),"date",{rid:r.id,L})};
 const f=all.slice(Math.max(0,idx-4),idx+1),fw=f.filter(z=>wonBy(z,tm)).length,fp=f.reduce((s2,z)=>s2+ptsFor(z,tm),0);
 const LT={en:["W","L"],fi:["V","H"],sv:["V","F"]}[L];
 Object.assign(c,{fnn:f.length,fwn:fw,letters:f.map(z=>wonBy(z,tm)),fn:C(f.length,"formN",{team:tm,rid:r.id}),fw:C(fw,"formW",{team:tm,rid:r.id}),fp:C(fp,"formP",{team:tm,rid:r.id}),fmax:C(f.length*3,"formMax",{team:tm,rid:r.id}),
  fstr:C(f.map(z=>wonBy(z,tm)?LT[0]:LT[1]).join("-"),"formStr",{team:tm,rid:r.id,L})});
 let k=0;for(let i=idx;i>=0;i--){if(wonBy(all[i],tm)===won)k++;else break}c.skn=k;c.sk=C(k,"streak",{team:tm,rid:r.id,won});
 const hh=all.slice(0,idx+1).filter(z=>z.h===opp||z.a===opp);c.hnn=hh.length;c.hn=C(hh.length,"h2hN",{team:tm,opp,rid:r.id});c.hw=C(hh.filter(z=>wonBy(z,tm)).length,"h2hW",{team:tm,opp,rid:r.id});
 if(latest){const i=STAND.findIndex(z=>z[0]===tm);if(i>=0){const row=STAND[i],pos=i+1,pts=row[2];
  Object.assign(c,{hasTable:true,posn:pos,in6:pos<=6,pos:C(fOrd(pos,L),"pos",{team:tm,L}),pts:C(pts,"pts",{team:tm}),ppg:C(fNum(pts/row[1],L),"ppg",{team:tm,L})});

/* ---------- story builder ---------- */
function story(tm,o={}){const L=o.lang||P.lang,len=o.len||"medium",tone=o.tone||"neutral";const c=ctx(tm,L,o.rid);if(!c)return null;const W=NL[L];
 const title=W.head(c,tone),body=[W.res(c,tone)];
 if(len!=="short"){body.push(W.form(c,tone));if(c.skn>=2&&tone!=="kids")body.push(W.streak(c));
  if(c.hasTable){body.push(W.table(c,tone));if(c.ng)body.push(W.next(c));if(tone==="analyst")body.push(W.ppg(c))}}
 if(len==="deep"){if(c.hnn>=2)body.push(W.h2h(c));if(c.hasTable)body.push(W.scen(c))}
 const cl=W.close(c,tone);if(cl&&len!=="short")body.push(cl);
 const why=c.hasTable?W.why(c):null;
 const toks=[...title,...body.flat(),...(why||[])];const claims=toks.filter(t=>t&&t.cl);
 return {id:"s:"+tm+":"+c.r.id,tm,c,title,body,why,claims,L,text:[plain(title),...body.map(plain),why?plain(why):""].join(" ")}}

function preview(g,L){L=L||P.lang;const W=NL[L].pv;const h=ctx(g.h,L),a=ctx(g.a,L);if(!h||!a||!h.hasTable||!a.hasTable)return null;
 const H=C(g.h,"team",{gid:g.id}),A=C(g.a,"team",{gid:g.id}),d=C(fDate(g.d,L),"gdate",{gid:g.id,L}),t=C(g.t,"gtime",{gid:g.id});
 const body=[W.l1(H,A,h,a,d,t),W.l2(H,A,h,a)];
 const hh=teamRes(g.h).filter(z=>z.h===g.a||z.a===g.a);if(hh.length){const lr=teamRes(g.h).slice(-1)[0];body.push(W.l3(H,C(hh.length,"h2hN",{team:g.h,opp:g.a,rid:lr.id}),hh.length,C(hh.filter(z=>wonBy(z,g.h)).length,"h2hW",{team:g.h,opp:g.a,rid:lr.id})))}
 body.push(W.l4(H,A,h,a));
 const near=Math.abs(h.posn-6.5)<=Math.abs(a.posn-6.5)?h:a;const why=NL[L].why(near);
 const title=W.title(H,A);const toks=[...title,...body.flat(),...why];
 return {id:"p:"+g.id,title,body,why,claims:toks.filter(z=>z&&z.cl),L,text:[plain(title),...body.map(plain),plain(why)].join(" ")}}

function leagueLine(r,L){const W=NL[L];const xt={en:xtE,fi:xtF,sv:xtS}[L][r.x]||"";const w=r.hs>r.as?r.h:r.a;
 const toks=[...K`${C(r.h,"team",{rid:r.id})} ${C(r.hs+"–"+r.as,"rscore",{rid:r.id})} ${C(r.a,"team",{rid:r.id})}${xt}. `,...W.lg(C(w,"team",{rid:r.id}),C(fOrd(posOf(w),L),"pos",{team:w,L}))];
 return {id:"l:"+r.id,toks,claims:toks.filter(z=>z&&z.cl),text:plain(toks)}}
function juniorLine(r,L){const toks=K`${C(r.h,"team",{rid:r.id})} ${C(r.hs+"–"+r.as,"rscore",{rid:r.id})} ${C(r.a,"team",{rid:r.id})} · ${C(fDate(r.d,L),"date",{rid:r.id,L})}`;return {id:"j:"+r.id,toks,claims:toks.filter(z=>z&&z.cl),text:plain(toks)}}
function juniorLead(L){const st=demoStand();const toks=NL[L].jlead(C(st[0][0],"dlead",{}),C(st[0][1],"dleadPts",{}));return {toks,claims:toks.filter(z=>z&&z.cl),text:plain(toks)}}
const weekFrom=()=>{const d=new Date(TODAY+"T12:00:00");d.setDate(d.getDate()-7);return iso(d)};
function weekStory(tm,L){const from=weekFrom();const rs=teamRes(tm).filter(r=>r.d>from);const p=rs.reduce((s2,r)=>s2+ptsFor(r,tm),0);
 const toks=NL[L].week(C(tm,"team",{st:1}),C(rs.length,"wkN",{team:tm,from}),rs.length,C(p,"wkP",{team:tm,from}),p,C(fOrd(posOf(tm),L),"pos",{team:tm,L}));

/* ---------- independent verifier ---------- */
function verify(cl){try{const f=cl.ref||{},v=cl.v;
 const R=id=>RESULTS.find(r=>r.id===id)||DEMO_R.find(r=>r.id===id),Gm=id=>GAMES.find(g=>g.id===id);
 const upto=(tm,id)=>{const o=[];for(const r of RESULTS)if(r.h===tm||r.a===tm)o.push(r);o.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);const j=o.findIndex(r=>r.id===id);return j<0?null:o.slice(0,j+1)};
 const Wn=(r,tm)=>(r.h===tm&&r.hs>r.as)||(r.a===tm&&r.as>r.hs);
 const P2=(r,tm)=>Wn(r,tm)?(r.x?2:3):(r.x?1:0);
 const si=tm=>{for(let i=0;i<STAND.length;i++)if(STAND[i][0]===tm)return i;return -1};
 const last5=()=>{const o=upto(f.team,f.rid);return o?o.slice(-5):null};
 switch(cl.k){
  case"team":{if(f.rid){const r=R(f.rid);return !!r&&(r.h===v||r.a===v)}if(f.gid){const g=Gm(f.gid);return !!g&&(g.h===v||g.a===v)}if(f.st)return si(v)>=0;return false}
  case"score":{const r=R(f.rid);if(!r)return false;const me=r.h===f.team?r.hs:r.a===f.team?r.as:null;if(me==null)return false;return v===me+"–"+(r.h===f.team?r.as:r.hs)}
  case"rscore":{const r=R(f.rid);return !!r&&v===r.hs+"–"+r.as}
  case"gpts":{const r=R(f.rid);return !!r&&v===String(P2(r,f.team))}
  case"date":{const r=R(f.rid);return !!r&&v===fDate(r.d,f.L)}
  case"formN":{const o=last5();return !!o&&v===String(o.length)}
  case"formW":{const o=last5();return !!o&&v===String(o.filter(r=>Wn(r,f.team)).length)}
  case"formP":{const o=last5();return !!o&&v===String(o.reduce((s2,r)=>s2+P2(r,f.team),0))}
  case"formMax":{const o=last5();return !!o&&v===String(o.length*3)}
  case"formStr":{const o=last5();const LT={en:["W","L"],fi:["V","H"],sv:["V","F"]}[f.L];return !!o&&v===o.map(r=>Wn(r,f.team)?LT[0]:LT[1]).join("-")}
  case"streak":{const o=upto(f.team,f.rid);if(!o||Wn(o[o.length-1],f.team)!==f.won)return false;let n=0;for(let i=o.length-1;i>=0&&Wn(o[i],f.team)===f.won;i--)n++;return v===String(n)}
  case"h2hN":{const o=upto(f.team,f.rid);return !!o&&v===String(o.filter(r=>r.h===f.opp||r.a===f.opp).length)}
  case"h2hW":{const o=upto(f.team,f.rid);return !!o&&v===String(o.filter(r=>(r.h===f.opp||r.a===f.opp)&&Wn(r,f.team)).length)}
  case"pos":{const i=si(f.team);return i>=0&&v===fOrd(i+1,f.L)}
  case"pts":{const i=si(f.team);return i>=0&&v===String(STAND[i][2])}
  case"ppg":{const i=si(f.team);return i>=0&&v===fNum(STAND[i][2]/STAND[i][1],f.L)}

 scs(text).forEach(y=>{if(!okS.has(y)&&!bad.includes(y))bad.push(y)});
 const ords=z=>z.match(/\b\d+(?:st|nd|rd|th)\b/g)||[];const okO=new Set();claims.forEach(c=>ords(c.v).forEach(y=>okO.add(y)));
 ords(text).forEach(y=>{if(!okO.has(y)&&!bad.includes(y))bad.push(y)});
 const named=new Set(claims.map(c=>c.v));
 ALLNAMES().forEach(nm=>{const re=new RegExp("(^|[^\\p{L}\\p{N}])"+nm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}])","u");if(re.test(text)&&!named.has(nm)&&!bad.includes(nm))bad.push(nm)});

function runTests(){const t0=performance.now();const res={stories:0,claims:0,wrong:0,unbacked:0,mut:0,mutCaught:0,byLang:{},inject:null};
 const langs=["fi","en","sv"],lens=["short","medium","deep"],tones=["fan","neutral","analyst","kids"];
 const add=(L,st)=>{if(!st)return;const fc=factCheck(st);res.stories++;res.claims+=fc.n;res.wrong+=fc.wrong.length;res.unbacked+=fc.unbacked.length;
  const b=res.byLang[L]||(res.byLang[L]={stories:0,claims:0,wrong:0});b.stories++;b.claims+=fc.n;b.wrong+=fc.wrong.length+fc.unbacked.length};
 langs.forEach(L=>{TEAMS.forEach(t=>{teamRes(t.name).slice(-3).forEach(r=>lens.forEach(len=>tones.forEach(tone=>add(L,story(t.name,{lang:L,len,tone,rid:r.id})))))});
  GAMES.forEach(g=>add(L,preview(g,L)));RESULTS.slice(-20).forEach(r=>add(L,leagueLine(r,L)));DEMO_R.forEach(r=>add(L,juniorLine(r,L)));add(L,juniorLead(L));TEAMS.forEach(t=>add(L,weekStory(t.name,L)))});
 /* mutation tests: change each fact on purpose; the verifier must reject every change */
 TEAMS.forEach(t=>{const st=story(t.name,{lang:"en",len:"deep",tone:"neutral"});if(!st)return;st.claims.forEach(c=>{let mv;
  if(c.k==="team"){const o=TEAMS.find(z=>z.name!==c.v&&z.name!==st.c.oppName&&z.name!==st.c.tmName);mv=o.name}
  else if(/^\d+$/.test(c.v))mv=String(+c.v+1);else if(/^\d+(st|nd|rd|th)$/.test(c.v))mv=fOrd(parseInt(c.v)+1,"en");
  else if(/–/.test(c.v)){const [a,b]=c.v.split("–");mv=(+a+1)+"–"+b}else if(/\d/.test(c.v))mv=c.v.replace(/\d/,d=>String((+d+1)%10));else mv=c.v.split("").reverse().join("");
  if(mv===c.v)return;res.mut++;if(!verify(Object.assign({},c,{v:mv})))res.mutCaught++})});
 const base=story("Kärpät",{lang:"en",len:"medium",tone:"neutral"})||story(TEAMS[0].name,{lang:"en"});
 if(base){const bad=checkText(base.text+" They have won 9 games in a row.",base.claims);res.inject={caught:bad.includes("9"),bad}}
 res.ms=Math.round(performance.now()-t0);res.at=new Date().toLocaleTimeString(LOC[P.lang],{hour:"2-digit",minute:"2-digit"});return res}

document.addEventListener("click",e=>{const q=z=>e.target.closest(z);let el;const x=s();if(v2Click(e,q,x))return;
 if(el=q("[data-bill]")){bill=el.dataset.bill;render();return}
 if(el=q("[data-plan]")){const pl=el.dataset.plan;
   if(pl==="premium"){P.sub={plan:"premium",billing:bill,start:TODAY,renew:addPeriod(TODAY,bill),auto:true,hist:[...((P.sub&&P.sub.hist)||[]),{d:TODAY,b:bill,trial:!(P.sub&&P.sub.hist&&P.sub.hist.length)}]};toast(x.upgraded)}
   else{P.sub={plan:"free",hist:(P.sub&&P.sub.hist)||[]};if(P.teams.length>4)P.teams=P.teams.slice(0,4);if(P.onboarded)toast(x.toFree)}
   if(P.screen==="plans")P.screen="select";else overlay=null;save();render();window.scrollTo(0,0);return}
 if(q("[data-paywall]")){if(P.screen==="app")overlay={pay:1};else P.screen="plans";render();window.scrollTo(0,0);return}
 if(q("[data-renew]")){const b=P.sub;const base=b.renew>TODAY?b.renew:TODAY;b.renew=addPeriod(base,b.billing);b.auto=true;b.hist=[...(b.hist||[]),{d:TODAY,b:b.billing}];save();toast(x.renewed(fmtD(b.renew)));render();return}
 if(q("[data-autorenew]")){P.sub.auto=!P.sub.auto;save();toast(P.sub.auto?x.renews(fmtD(P.sub.renew)):x.cancelled);render();return}
 if(q("[data-annual]")){const b=P.sub;b.billing="annual";b.renew=addPeriod(TODAY,"annual");b.auto=true;b.hist=[...(b.hist||[]),{d:TODAY,b:"annual"}];save();toast(x.switched);render();return}
 if(q("[data-tofree]")){P.sub={plan:"free",hist:P.sub.hist||[]};if(P.teams.length>4)P.teams=P.teams.slice(0,4);save();toast(x.toFree);render();return}
 if(q("[data-logout]")){stopPod();P.user=Object.assign({},P.user,{in:false});P.screen="login";overlay=null;save();render();window.scrollTo(0,0);return}
 if(q("[data-social]")){toast(x.socialDemo);return}
 if(q("[data-forgot]")){toast(x.resetSent);return}
 if(q("[data-modeflip]")){P.mode=isLight()?"dark":"light";save();render();return}
 if(el=q("[data-mode]")){P.mode=el.dataset.mode;save();render();return}
 if(q("[data-langmenu]")){langOpen=!langOpen;render();return}
 if(el=q("[data-lang]")){P.lang=el.dataset.lang;langOpen=false;save();render();return}
 if(langOpen&&!q(".langmenu")){langOpen=false;render();return}
 if(el=q("[data-preview]")){P.voice=el.dataset.preview;save();speak([s().sample]);render();return}
 if(el=q("[data-voice]")){P.voice=el.dataset.voice;save();
   if(el.closest("[data-pod]")){document.querySelectorAll(".vsw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.voice===P.voice));if(pod.on){const id=pod.id;stopPod();playPod(id)}return}
   render();return}
 if(el=q("[data-go]")){const to=el.dataset.go;if(to==="personal"&&!P.teams.length){toast(x.pickTeam);return}P.screen=to;if(to==="app"){tab="home";overlay=null;P.onboarded=true}save();render();window.scrollTo(0,0);return}
 if(el=q("[data-team]")){const n=el.dataset.team;if(P.teams.includes(n)){if(P.teams.length===1&&P.screen==="app"){toast(x.pickTeam);return}P.teams=P.teams.filter(t=>t!==n)}else{if(!isPrem()&&P.teams.length>=4){toast(x.maxTeams);if(P.screen==="app"){overlay={pay:1};render();window.scrollTo(0,0)}return}P.teams=[...P.teams,n];if(!P.tf[n])P.tf[n]=["summary"]}save();render();return}
 if(el=q("[data-tf]")){const tm=el.dataset.tf,k=el.dataset.k;if(!isPrem()){P.tf[tm]=["summary"];save();render();return}const cur=tf(tm);if(cur.includes(k)){if(cur.length===1){toast(x.needOne);return}P.tf[tm]=cur.filter(f=>f!==k)}else P.tf[tm]=[...cur,k];save();render();return}
 if(el=q("[data-open-fmt]")){openFmt[el.dataset.openFmt]=el.dataset.k;render();return}
 if(el=q("[data-tab]")){tab=el.dataset.tab;overlay=null;store.set("fu2.tab",tab);render();window.scrollTo(0,0);return}
 if(q("[data-notif]")){overlay={notif:1};live.goals=0;render();window.scrollTo(0,0);return}
 if(cmClick(e))return;
 if(el=q("[data-lshare]")){shareNow(el.dataset.lshare);return}
 if(el=q("[data-player]")){overlay={player:el.dataset.player,back:overlay&&(overlay.id||overlay.back)};pSeg="data";render();window.scrollTo(0,0);return}
 if(q("[data-pback]")){overlay=overlay&&overlay.back?{id:overlay.back}:null;render();window.scrollTo(0,0);return}
 if(el=q("[data-pseg]")){pSeg=el.dataset.pseg;render();return}
 if(el=q("[data-box]")){boxSide=el.dataset.box;const ln=$("#lan");const g=overlay&&overlay.id&&findGame(overlay.id);if(ln&&g)ln.innerHTML=liveAnalytics(g);return}
 if(q("[data-close]")){overlay=null;render();window.scrollTo(0,0);return}
 if(q("[data-golive]")){startLive();return}
 if(el=q("[data-podplay]")){playPod(el.dataset.podplay);return}
 if(el=q("[data-fs]")){e.stopPropagation();toggleFs(el.closest(".reel"));return}
 if(el=q("[data-reel]")){toggleReel(el.dataset.reel);return}
 if(el=q("[data-open]")){if(overlay&&overlay.id===el.dataset.open)return;overlay={id:el.dataset.open};dSeg="sum";render();window.scrollTo(0,0);return}
 if(el=q("[data-mseg]")){mSeg=el.dataset.mseg;render();return}
 if(el=q("[data-mfil]")){mFil=el.dataset.mfil;render();return}
 if(el=q("[data-tseg]")){tSeg=el.dataset.tseg;render();return}
 if(el=q("[data-nseg]")){nSeg=el.dataset.nseg;render();return}
 if(el=q("[data-dseg]")){dSeg=el.dataset.dseg;render();return}
 if(el=q("[data-calteam]")){calTeam=el.dataset.calteam;render();return}
 if(el=q("[data-calm]")){const [Y,M]=calMonth.split("-").map(Number);calMonth=iso(new Date(Y,M-1+(+el.dataset.calm),1)).slice(0,7);render();return}
 if(el=q("[data-cday]")){calSel=el.dataset.cday;render();return}
 if(el=q("[data-pick]")){if(live.min>=60)return;contest.pick=el.dataset.pick;const cb=$("#cbox");if(cb)cb.innerHTML=contestBox(findGame(contest.game));return}
 if(q("[data-mascot]")){mood=Date.now()+1500;bub=x.cheer;const cb=$("#cbox");if(cb)cb.innerHTML=contestBox(findGame(contest.game));return}
 if(el=q("[data-ntg]")){P.notif[el.dataset.ntg]=!P.notif[el.dataset.ntg];save();render();return}
 if(q("[data-restart]")){P.screen="splash";save();render();window.scrollTo(0,0);return}
 if(q("[data-clear]")){store.clear();P=DEF();me=0;overlay=null;render();window.scrollTo(0,0);return}
 if(q("[data-report]")){toast(x.sent);return}
});

  logErr="";P.user=Object.assign({name:email.split("@")[0]},P.user||{},{email,in:true});P.screen=P.onboarded?"app":"plans";if(P.screen==="app")tab="home";save();render();window.scrollTo(0,0)}});
